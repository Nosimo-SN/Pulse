plugin:
  name: "Pulse"
  version: "1.0.0"
  description: >-
    Timers for your own SkyrimNet triggers. Each timer you switch on sends a mod event when it fires:
    Pulse_Fixed1 to Pulse_Fixed4 every set number of seconds, Pulse_Random1 to Pulse_Random4 after a new
    random delay between a min and a max each time. In the trigger editor, use event type mod_event and
    match event_name (num_arg holds the seconds counted). Pulse itself posts nothing to SkyrimNet; what
    people hear about is your trigger's response. Time counts only while you play, not in menus or loading screens.
    Changes apply within about five seconds, no restart needed.
  icon: "⏱️"

schema:
  fields:
    # --- Fixed timers ----------------------------------------------------------------------------
    - name: "Fixed 1"
      path: "fixed1.enabled"
      type: "bool"
      description: "Sends the mod event Pulse_Fixed1 every interval below. num_arg = the interval, str_arg = fixed."
      defaultValue: false
      category: "Fixed Timers"

    - name: "Fixed 1 Interval (seconds)"
      path: "fixed1.interval"
      type: "int"
      description: "Seconds between Pulse_Fixed1 events, 1 to 1200."
      defaultValue: 30
      min: 1
      max: 1200
      category: "Fixed Timers"

    - name: "Fixed 2"
      path: "fixed2.enabled"
      type: "bool"
      description: "Sends the mod event Pulse_Fixed2 every interval below. num_arg = the interval, str_arg = fixed."
      defaultValue: false
      category: "Fixed Timers"

    - name: "Fixed 2 Interval (seconds)"
      path: "fixed2.interval"
      type: "int"
      description: "Seconds between Pulse_Fixed2 events, 1 to 1200."
      defaultValue: 60
      min: 1
      max: 1200
      category: "Fixed Timers"

    - name: "Fixed 3"
      path: "fixed3.enabled"
      type: "bool"
      description: "Sends the mod event Pulse_Fixed3 every interval below. num_arg = the interval, str_arg = fixed."
      defaultValue: false
      category: "Fixed Timers"

    - name: "Fixed 3 Interval (seconds)"
      path: "fixed3.interval"
      type: "int"
      description: "Seconds between Pulse_Fixed3 events, 1 to 1200."
      defaultValue: 300
      min: 1
      max: 1200
      category: "Fixed Timers"

    - name: "Fixed 4"
      path: "fixed4.enabled"
      type: "bool"
      description: "Sends the mod event Pulse_Fixed4 every interval below. num_arg = the interval, str_arg = fixed."
      defaultValue: false
      category: "Fixed Timers"

    - name: "Fixed 4 Interval (seconds)"
      path: "fixed4.interval"
      type: "int"
      description: "Seconds between Pulse_Fixed4 events, 1 to 1200."
      defaultValue: 600
      min: 1
      max: 1200
      category: "Fixed Timers"

    # --- Random timers ---------------------------------------------------------------------------
    - name: "Random 1"
      path: "random1.enabled"
      type: "bool"
      description: "Sends the mod event Pulse_Random1 after a random delay between the min and max below, drawn again after every event. num_arg = the delay that just passed, str_arg = random."
      defaultValue: false
      category: "Random Timers"

    - name: "Random 1 Min (seconds)"
      path: "random1.min"
      type: "int"
      description: "Shortest delay before Pulse_Random1, 1 to 1200. If it is above the max, the two are swapped."
      defaultValue: 30
      min: 1
      max: 1200
      category: "Random Timers"

    - name: "Random 1 Max (seconds)"
      path: "random1.max"
      type: "int"
      description: "Longest delay before Pulse_Random1, 1 to 1200. Set it equal to the min for a fixed delay."
      defaultValue: 90
      min: 1
      max: 1200
      category: "Random Timers"

    - name: "Random 2"
      path: "random2.enabled"
      type: "bool"
      description: "Sends the mod event Pulse_Random2 after a random delay between the min and max below, drawn again after every event. num_arg = the delay that just passed, str_arg = random."
      defaultValue: false
      category: "Random Timers"

    - name: "Random 2 Min (seconds)"
      path: "random2.min"
      type: "int"
      description: "Shortest delay before Pulse_Random2, 1 to 1200. If it is above the max, the two are swapped."
      defaultValue: 60
      min: 1
      max: 1200
      category: "Random Timers"

    - name: "Random 2 Max (seconds)"
      path: "random2.max"
      type: "int"
      description: "Longest delay before Pulse_Random2, 1 to 1200. Set it equal to the min for a fixed delay."
      defaultValue: 180
      min: 1
      max: 1200
      category: "Random Timers"

    - name: "Random 3"
      path: "random3.enabled"
      type: "bool"
      description: "Sends the mod event Pulse_Random3 after a random delay between the min and max below, drawn again after every event. num_arg = the delay that just passed, str_arg = random."
      defaultValue: false
      category: "Random Timers"

    - name: "Random 3 Min (seconds)"
      path: "random3.min"
      type: "int"
      description: "Shortest delay before Pulse_Random3, 1 to 1200. If it is above the max, the two are swapped."
      defaultValue: 120
      min: 1
      max: 1200
      category: "Random Timers"

    - name: "Random 3 Max (seconds)"
      path: "random3.max"
      type: "int"
      description: "Longest delay before Pulse_Random3, 1 to 1200. Set it equal to the min for a fixed delay."
      defaultValue: 600
      min: 1
      max: 1200
      category: "Random Timers"

    - name: "Random 4"
      path: "random4.enabled"
      type: "bool"
      description: "Sends the mod event Pulse_Random4 after a random delay between the min and max below, drawn again after every event. num_arg = the delay that just passed, str_arg = random."
      defaultValue: false
      category: "Random Timers"

    - name: "Random 4 Min (seconds)"
      path: "random4.min"
      type: "int"
      description: "Shortest delay before Pulse_Random4, 1 to 1200. If it is above the max, the two are swapped."
      defaultValue: 300
      min: 1
      max: 1200
      category: "Random Timers"

    - name: "Random 4 Max (seconds)"
      path: "random4.max"
      type: "int"
      description: "Longest delay before Pulse_Random4, 1 to 1200. Set it equal to the min for a fixed delay."
      defaultValue: 1200
      min: 1
      max: 1200
      category: "Random Timers"

    # --- Debug -----------------------------------------------------------------------------------
    - name: "Log Every Event"
      path: "debug.log_fires"
      type: "bool"
      description: "Write each event Pulse sends to Pulse.log (next to skse64.log)."
      defaultValue: false
      category: "Debug"
